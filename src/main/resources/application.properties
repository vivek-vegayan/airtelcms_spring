#################################### Excel Bulk Upload (Employee) #######################################

# Rows per DB batch/transaction chunk
excel.upload.batch-size=100
# If a batch fails for a non-row-scoped reason (dropped connection, deadlock, etc.),
# continue processing remaining batches instead of aborting the whole upload
excel.upload.continue-on-batch-failure=true
# Hours a completed upload job's status/result stays queryable before eviction
excel.upload.job-retention-hours=24

excel.upload.executor-core-pool-size=2
excel.upload.executor-max-pool-size=4
excel.upload.executor-queue-capacity=50

spring.jackson.serialization.write-dates-as-timestamps=false

#################################### UI Action Audit Log ################################################

# Audit rows are written on their own small pool so a tiny, frequent write can
# never queue behind a long-running import. If the queue fills, the write runs
# inline on the request thread (CallerRunsPolicy) rather than being dropped.
audit.log.executor-core-pool-size=2
audit.log.executor-max-pool-size=4
audit.log.executor-queue-capacity=500

# Window in which an identical action by the same actor is treated as a repeat
# of the one already recorded (double-click, React double-invoke, component
# remount, client retry). Set to 0 to record every request.
audit.log.dedupe-window-ms=4000