remedy.pass-sit=Airtel@123
remedy.pass-prod=Philippines@8739

remedy.sit-url=https://helix-sit.apps.n2ocp-tclus-01.india.airtel.itm
remedy.prod-url=https://helixitsm.api.airtel.com

# Remedy/Cygnet schedule sync (RemedyCygnetSyncScheduler).
# fixed-delay-ms is counted from the END of the previous cycle, so a batch that
# runs long simply delays the next one instead of overlapping it.
remedy.cygnet-sync.enabled=false
remedy.cygnet-sync.fixed-delay-ms=60000
remedy.cygnet-sync.initial-delay-ms=60000
# true everywhere Remedy is reachable. Set false on a local machine: the cycle
# still runs and still marks CRQs DONE, but the Remedy call is skipped and the
# payload is logged instead. MUST stay true in production.
remedy.cygnet-sync.push-enabled=false

# Spring's scheduler defaults to a single thread, which this job would share
# with SessionCleanupJob and ExcelUploadJobStore - a long sync cycle would hold
# all three up. Three threads keeps them independent.
spring.task.scheduling.pool-size=3

